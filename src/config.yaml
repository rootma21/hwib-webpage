site:
  name: Houston Women+ in Bioinformatics
  site: 'https://houston-wib.org/'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: 'Houston Women+ in Bioinformatics'
  description: 'The online presence of Women+ in Bioinformatics in the Houston Area'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Houston Women+ in Bioinformatics'
    images:
      - url: '~/assets/images/HWIB_Logo.png'
        width: 1000
        height: 1000
    type: website
  twitter:
    handle: '@houston-area-womens-bioinformatics'
    site: '@houston-area-womens-bioinformatics'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    series:
      isEnabled: true
      pathname: 'series' # Series main path /series/some-series
      robots:
        index: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  newsletter:
    isEnabled: true
    postsPerPage: 10

    post:
      isEnabled: true
      permalink: 'newsletter/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%
      robots:
        index: true
        follow: true

    list:
      isEnabled: true
      pathname: 'newsletter' # Newsletter main path, you can change this to "news" (/news)
      robots:
        index: true
        follow: true

analytics:
  vendors:
    googleAnalytics:
      id: false # TODO: set to HWIB's own GA4 measurement ID once created — leaving Boston's ID here would send HWIB traffic into Boston's analytics account

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
